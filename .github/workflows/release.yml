name: Release

on:
  push:
    tags: ['v*']
  # So a release can be rehearsed against a branch without cutting a tag. The
  # dispatch path builds and uploads the artifacts and stops short of creating
  # a GitHub release.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: macOS universal
    # macOS only, and on purpose. briefcred's daemon is a LaunchAgent that
    # gates minting behind Touch ID through `LAContext`; the Linux paths
    # compile and are unit-tested, but there is nothing to ship for them yet.
    runs-on: macos-latest
    permissions:
      # Job-wide, because GitHub grants permissions per job and not per step.
      # Only the last step actually writes — `gh release create` — and every
      # step before it reads. Narrowing this further would mean splitting the
      # release creation into a job of its own, which would have to re-download
      # what this one built to gain nothing.
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Work out the version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            version="${REF_NAME#v}"
          else
            version="$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building briefcred $version"

      # A tag that does not match the version in the workspace manifest would
      # produce a tarball whose name and whose `briefcred --version` disagree,
      # which is the kind of thing nobody notices until somebody is trying to
      # reproduce a bug.
      - name: Check the tag matches the crate version
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          crate="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [[ "$crate" != "$VERSION" ]]; then
            echo "tag says $VERSION, Cargo.toml says $crate" >&2
            exit 1
          fi

      - name: Build universal binaries
        run: release/scripts/build-universal.sh staging

      - name: Sign and notarise
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: release/scripts/sign-and-notarize.sh staging

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: release/scripts/package.sh "$VERSION" staging dist

      # The formula in the tree carries a placeholder checksum, because the
      # checksum of a release that has not been built yet does not exist. This
      # stamps in the real one and the matching URL. Publishing it is a
      # separate, manual act: the tap is its own repository, created out of
      # band, and this workflow has no business holding a token for it. What it
      # does is put the finished formula next to the tarball it describes, so
      # updating the tap is a copy rather than a hand-edit.
      - name: Stamp the Homebrew formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRIEFCRED_REPO: ${{ github.repository }}
        run: |
          # The tarball is found rather than named. `package.sh` owns that
          # filename, and spelling it a second time here would be two strings
          # that have to agree with nobody checking that they do. It writes
          # exactly one archive, so a glob that finds anything else is a
          # packaging change this step should fail on.
          shopt -s nullglob
          tarballs=(dist/*.tar.gz)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "expected one tarball in dist/, found ${#tarballs[@]}" >&2
            exit 1
          fi
          release/scripts/stamp-formula.sh \
            "$VERSION" \
            "${tarballs[0]}" \
            release/Formula/briefcred.rb \
            dist/briefcred.rb

      # Uploaded whether or not a release is created, so a dispatch run leaves
      # something to download and a tag run leaves the same bytes twice.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: briefcred-${{ steps.version.outputs.version }}-macos-universal
          path: dist/

      - name: Write the release notes
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            if [[ "${BRIEFCRED_SIGNED:-}" == "1" ]]; then
              echo "Signed with a Developer ID certificate and notarised by Apple."
            else
              echo "**Unsigned build.** No Apple signing credentials were"
              echo "available to this run, so macOS will quarantine the"
              echo "binaries on first launch. Check the SHA-256 sums below"
              echo "against the ones in the job log before running them."
            fi
            echo
            echo '## Checksums'
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > release-notes.md

      - name: Create the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "briefcred $VERSION" \
            --notes-file release-notes.md \
            dist/*
