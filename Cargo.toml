[workspace]
resolver = "2"
members = [
    "crates/briefcred-core",
    "crates/briefcred-proto",
    "crates/briefcred-daemon",
    "crates/briefcred-cli",
    "crates/briefcred-hook",
    "crates/briefcred-e2e",
    "crates/briefcred-helper-postgres",
    "crates/briefcred-helper-sts",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vkend/briefcred"

[workspace.dependencies]
briefcred-core = { path = "crates/briefcred-core", version = "0.1.0" }
briefcred-proto = { path = "crates/briefcred-proto", version = "0.1.0" }
briefcred-helper-postgres = { path = "crates/briefcred-helper-postgres", version = "0.1.0" }
briefcred-helper-sts = { path = "crates/briefcred-helper-sts", version = "0.1.0" }

async-trait = "0.1"
base64 = "0.22"
blake2 = "0.10"
cedar-policy = "4"
chacha20poly1305 = "0.11"
block2 = "0.6"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
dialoguer = { version = "0.12", default-features = false, features = ["password"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
inventory = "0.3"
libc = "0.2"
mach2 = "0.4"
notify = "8"
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
objc2-local-authentication = "0.3"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
postgres-protocol = "0.6"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser", "zeroize"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
schemars = "1"
security-framework = "3"
sendfd = { version = "0.4", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha1 = "0.11"
sha2 = "0.10"
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "getrandom", "rand_core", "std"] }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde", "serde-well-known"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-time-0_3"] }
tokio-postgres-rustls = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "0.9"
webpki-roots = "1"
x25519-dalek = { version = "3", features = ["getrandom"] }
x509-parser = "0.18"
zeroize = { version = "1", features = ["derive"] }

# The memory-hygiene self-scan hashes a 32-byte window at every offset of the
# daemon's resident heap, which is tens of millions of SHA-256 blocks. Debug
# `sha2` is roughly two orders of magnitude slower than optimised `sha2`, which
# is the difference between a four-second check and one nobody ever runs. The
# override costs nothing else: no briefcred code is compiled differently.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.cpufeatures]
opt-level = 3
