[package]
name = "briefcred-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The briefcred command-line interface."

[lib]
name = "briefcred_cli"
path = "src/lib.rs"

[[bin]]
name = "briefcred"
path = "src/main.rs"

[dependencies]
briefcred-core.workspace = true
briefcred-proto.workspace = true
base64.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
dialoguer.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process", "rt", "time", "io-std"] }
toml.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }
