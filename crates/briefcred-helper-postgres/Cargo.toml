[package]
name = "briefcred-helper-postgres"
description = "The briefcred PostgreSQL minting helper process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "briefcred-helper-postgres-dynamic"
path = "src/main.rs"

[lib]
name = "briefcred_helper_postgres"
path = "src/lib.rs"

[dependencies]
briefcred-core.workspace = true
briefcred-proto.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt", "rt-multi-thread"] }
zeroize.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }
