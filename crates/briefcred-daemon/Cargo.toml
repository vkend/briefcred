[package]
name = "briefcred-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The briefcred per-user daemon."

[lib]
name = "briefcred_daemon"
path = "src/lib.rs"

[[bin]]
name = "briefcred-daemon"
path = "src/main.rs"

[features]
# Adds `Request::HeapScan`, which lets a same-uid caller ask the daemon whether
# a digest matches anything in its own memory. That is a confirmation oracle,
# so it is never built into a shipping daemon: only `just mem-hygiene` enables
# it, to check that a master really is gone after a revoke.
debug-heapscan = ["briefcred-proto/debug-heapscan", "dep:mach2", "dep:sha2"]

[dependencies]
briefcred-core.workspace = true
briefcred-proto.workspace = true
async-trait.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
libc.workspace = true
notify.workspace = true
serde.workspace = true
sha2 = { workspace = true, optional = true }
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process", "signal", "sync"] }
tokio-postgres.workspace = true
toml.workspace = true
zeroize.workspace = true
rmcp = { version = "3.2.0", default-features = false, features = ["server", "macros", "schemars", "transport-async-rw"] }
schemars = "1.2.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
mach2 = { workspace = true, optional = true }
objc2.workspace = true
objc2-core-foundation.workspace = true
objc2-foundation.workspace = true
objc2-local-authentication.workspace = true

[dev-dependencies]
briefcred-core = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
