[package]
name = "briefcred-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The briefcred per-user daemon."

[lib]
name = "briefcred_daemon"
path = "src/lib.rs"

[[bin]]
name = "briefcred-daemon"
path = "src/main.rs"

[dependencies]
briefcred-core.workspace = true
briefcred-proto.workspace = true
async-trait.workspace = true
getrandom.workspace = true
hex.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
libc.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "signal", "sync"] }
toml.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-core-foundation.workspace = true
objc2-foundation.workspace = true
objc2-local-authentication.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
