[package]
name = "briefcred-core"
description = "Core types, profile schema, and credential minters for briefcred."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Exposes in-memory test doubles (`source::MemorySource`) to other crates'
# tests. Never enable it for a production build: the doubles exist to be
# constructed with known secrets.
test-util = []

[dependencies]
briefcred-proto.workspace = true
async-trait.workspace = true
base64.workspace = true
blake2.workspace = true
cedar-policy.workspace = true
getrandom.workspace = true
hex.workspace = true
inventory.workspace = true
postgres-protocol.workspace = true
rcgen.workspace = true
ed25519-dalek.workspace = true
regex.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
rustls-pemfile.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
ssh-key.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
toml.workspace = true
x509-parser.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }
tokio-rustls.workspace = true
