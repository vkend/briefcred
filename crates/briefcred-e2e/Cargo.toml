[package]
name = "briefcred-e2e"
description = "End-to-end tests for briefcred, including the ephemeral PostgreSQL harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
briefcred-core.workspace = true
briefcred-proto.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
getrandom.workspace = true
tempfile.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "time"] }
tokio-postgres.workspace = true
zeroize.workspace = true

[features]
# Enables `briefcred-proto`'s `HeapScan` request so the memory-hygiene test can
# build. The daemon it talks to has to be built with its own `debug-heapscan`
# feature separately; `just mem-hygiene` does both.
debug-heapscan = ["briefcred-proto/debug-heapscan"]

[dev-dependencies]
briefcred-cli = { path = "../briefcred-cli", version = "0.1.0" }
futures-util.workspace = true
hex.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util = { workspace = true, features = ["server"] }
rustls.workspace = true
sha2.workspace = true
rustls-pemfile.workspace = true
rustls-pki-types.workspace = true
time.workspace = true
tokio-rustls.workspace = true
rmcp = { version = "3.2.0", default-features = false, features = ["client", "macros", "transport-async-rw"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
# The gRPC matrix through the proxy. Hand-written stubs rather than generated
# ones: `tonic-build` needs a `protoc` on the machine, and the four call shapes
# under test are the runtime's, not the code generator's.
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "server"] }
tonic-prost = "0.14"
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio-stream = { version = "0.1", default-features = false }
